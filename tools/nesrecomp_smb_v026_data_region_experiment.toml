# Evaluation-only annotations for the exact canonical SMB_v026 ROM.
# The IRQ-vector target $FFF0 is treated as data based on verified byte layout.
# SMB also uses the generic inline-argument dispatcher at $8E04: its two bytes
# after JSR encode a dynamic code target. This list seeds the targets found in
# the canonical PRG after the byte pattern JSR $8E04. This is experiment-only;
# it is not a final game config, and runtime route coverage must still be tested.
[game]
output_prefix = "smb_v026_data_region_experiment"
cycle_accurate = true
cycle_inline_jmp = ["8E04:2"]

[functions]
fixed = [
  0x8231, 0x8567, 0x858B, 0x859B, 0x8652, 0x865A, 0x86A8, 0x86E6,
  0x85BF, 0x85E3, 0x8643, 0x86FF, 0x8732, 0x8749, 0x889D, 0x92AA,
  0x8FCF, 0xCFEC, 0x9224, 0x92DB, 0x98E5, 0x974C, 0x8FE4, 0x9131,
  0xB35A, 0xBDD2, 0xC30E, 0xC3A4, 0xC8E0, 0xCA77, 0xD432, 0xD311
]

[[data_region]]
bank = 7
start = 0xFFF0
end = 0xFFFF
