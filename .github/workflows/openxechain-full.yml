name: OpenXeChain Full XEX Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/openxechain-hello.c'
      - 'scripts/build-smb-xex.sh'
      - 'src/platform/xex/**'
      - 'patches/nathsou-ppu-endian.patch'
      - '.github/workflows/openxechain-full.yml'

concurrency:
  group: openxechain-full-xex
  cancel-in-progress: true

jobs:
  build-xex:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENXECHAIN_COMMIT: eed1fa65bf9577fd31625764b320a90182ea9ade
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build git build-essential bzip2 gzip findutils sed tar unzip zip gawk python3 python3-yaml file xxd
      - name: Fetch pinned OpenXeChain buildscript
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf git@github.com:
          git clone https://github.com/OpenXeChain/buildscript.git openxechain
          git -C openxechain checkout --detach "$OPENXECHAIN_COMMIT"
          git -C openxechain submodule sync --recursive
          git -C openxechain submodule update --init --recursive
          test "$(git -C openxechain rev-parse HEAD)" = "$OPENXECHAIN_COMMIT"
          test "$(git -C openxechain/llvm rev-parse HEAD)" = "890b83f6c8259a8899e182a5f7d9cf39c64131cc"
          test "$(git -C openxechain/newlib rev-parse HEAD)" = "f929633c27099d404e9cb5b2739a9c7f9b6afccc"
          test "$(git -C openxechain/synthxex rev-parse HEAD)" = "48d1453a55468aa2f8a211db0b20edd594ef5be3"
          test "$(git -C openxechain/xecorelib rev-parse HEAD)" = "c65d67e071357acade681f04c46ae9719797f239"
      - name: Build complete OpenXeChain toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PREFIX="$PWD/openxechain-sysroot"
          export PARALLEL="$(nproc)"
          export BUILD_TYPE=Release
          cd openxechain
          bash ./build-toolchain.sh
          test -x "$PREFIX/bin/clang"
          test -x "$PREFIX/bin/lld-link"
          test -x "$PREFIX/bin/synthxex"
          "$PREFIX/bin/clang" --version
          "$PREFIX/bin/synthxex" --version
      - name: Prove minimal PE to XEX2 path
        shell: bash
        run: |
          set -euo pipefail
          export TC="$PWD/openxechain-sysroot"
          export PATH="$TC/bin:$PATH"
          export C_INCLUDE_PATH=
          export CPLUS_INCLUDE_PATH=
          export LIBRARY_PATH=
          "$TC/bin/clang" scripts/openxechain-hello.c -o hello.exe
          test -s hello.exe
          "$TC/bin/synthxex" -i hello.exe -o hello.xex -t title
          test "$(dd if=hello.xex bs=1 count=4 2>/dev/null)" = "XEX2"
          sha256sum hello.exe hello.xex | tee HELLO_SHA256SUMS.txt
      - name: Build real SMB Xbox OS XEX
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-smb-xex.sh
          OPENXECHAIN_PREFIX="$PWD/openxechain-sysroot" \
            SMB360_XEX_WORK="$PWD/build-xex" \
            scripts/build-smb-xex.sh
          test -s build-xex/out/default.xex
          test "$(dd if=build-xex/out/default.xex bs=1 count=4 2>/dev/null)" = "XEX2"
          file build-xex/out/smb360.exe || true
          sha256sum build-xex/out/default.xex
      - name: Stage Aurora XeXMenu test package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/SMB360
          cp build-xex/out/default.xex release/SMB360/default.xex
          cp build-xex/out/SHA256SUMS.txt release/SMB360/SHA256SUMS.txt
          cp build-xex/out/BUILD_MANIFEST.txt release/SMB360/BUILD_MANIFEST.txt
          cat > release/SMB360/README_PTBR.txt <<'EOF'
          SMB360 - build Xbox OS / XEX

          Coloque o arquivo smb.nes fornecido pelo proprietario na mesma pasta de default.xex.
          Abra default.xex pelo Aurora ou XeXMenu.
          Start + Back juntos encerram o teste e retornam ao launcher.

          Arquivos Nintendo nao sao incluidos neste artefato de CI.
          EOF
          (cd release && zip -r ../SMB360_XEX_TEST.zip SMB360)
          sha256sum SMB360_XEX_TEST.zip > SMB360_XEX_TEST.zip.sha256
      - name: Upload real SMB XEX
        uses: actions/upload-artifact@v4
        with:
          name: smb360-xex-real-core
          path: |
            release/SMB360/
            SMB360_XEX_TEST.zip
            SMB360_XEX_TEST.zip.sha256
            HELLO_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
