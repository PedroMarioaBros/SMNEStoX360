name: S017 Native Xbox 360 CRT-free XEX verification
# Native title entry without Newlib's CRT after real S015 hardware Fatal Crash.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/platform/canonical_xex/native_crtless_probe.c'
      - 'src/platform/canonical_xex/native_crtless_canonical.c'
      - 'src/platform/canonical_xex/native_crtless_memory.c'
      - 'src/platform/canonical_xex/embedded_rom.S'
      - 'src/canonical/**'
      - 'assets/canonical/**'
      - 'scripts/build-crtless-xex.sh'
      - 'tools/verify_crtless_xex.py'
      - 'docs/TESTE_FISICO_S017.md'
      - '.github/workflows/xex-crtless.yml'
  pull_request:
    paths:
      - 'src/platform/canonical_xex/native_crtless_probe.c'
      - 'src/platform/canonical_xex/native_crtless_canonical.c'
      - 'src/platform/canonical_xex/native_crtless_memory.c'
      - 'src/platform/canonical_xex/embedded_rom.S'
      - 'src/canonical/**'
      - 'assets/canonical/**'
      - 'scripts/build-crtless-xex.sh'
      - 'tools/verify_crtless_xex.py'
      - 'docs/TESTE_FISICO_S017.md'
      - '.github/workflows/xex-crtless.yml'
permissions:
  contents: read
  actions: read

env:
  OPENXECHAIN_COMMIT: eed1fa65bf9577fd31625764b320a90182ea9ade
  OPENXECHAIN_PREFIX: ${{ github.workspace }}/.openxechain/sysroot
  SMB360_CRTLESS_WORK: ${{ github.workspace }}/build-crtless-xex

jobs:
  build-crtless-xex:
    name: OpenXeChain + explicit native Xbox entry without Newlib CRT
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Baixar SMBtoX360
        uses: actions/checkout@v4

      - name: Instalar dependências do OpenXeChain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld binutils git cmake make ninja-build python3 python3-yaml \
            bzip2 gzip grep findutils sed tar unzip zip gawk zlib1g-dev

      - name: Restaurar cache OpenXeChain
        id: openxechain-cache
        uses: actions/cache@v4
        with:
          path: .openxechain/sysroot
          key: openxechain-${{ runner.os }}-${{ env.OPENXECHAIN_COMMIT }}-clang-e-v1

      - name: Baixar toolchain OpenXeChain validada (run #21)
        env:
          GH_TOKEN: ${{ secrets.OPENXECHAIN_ARTIFACT_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "OPENXECHAIN_ARTIFACT_TOKEN ausente; usando fallback de compilacao local." >&2
            exit 78
          fi
          mkdir -p .openxechain-download "$OPENXECHAIN_PREFIX"
          curl -L --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o .openxechain-download/toolchain.zip \
            "https://api.github.com/repos/PedroMarioaBros/OpenXeChain-X360-Builder/actions/artifacts/10894786560/zip"
          unzip -q .openxechain-download/toolchain.zip -d .openxechain-download/artifact
          mkdir -p .openxechain
          tar -xJf .openxechain-download/artifact/openxechain-x360-toolchain.tar.xz -C .openxechain
          test -x "$OPENXECHAIN_PREFIX/bin/clang"
          test -x "$OPENXECHAIN_PREFIX/bin/synthxex"
        continue-on-error: true

      - name: Fallback - compilar OpenXeChain se artefato nao estiver acessivel
        run: |
          if [ -x "$OPENXECHAIN_PREFIX/bin/clang" ] && [ -x "$OPENXECHAIN_PREFIX/bin/synthxex" ]; then
            echo "Toolchain importada do run #21; fallback dispensado."
            exit 0
          fi
          rm -rf .openxechain-src
          git clone https://github.com/OpenXeChain/buildscript.git .openxechain-src
          git -C .openxechain-src checkout --detach "$OPENXECHAIN_COMMIT"
          sed -i 's#git@github.com:#https://github.com/#g; s#ssh://git@github.com/#https://github.com/#g' .openxechain-src/.gitmodules
          echo "Gitmodules apos conversao para HTTPS:"
          cat .openxechain-src/.gitmodules
          git -C .openxechain-src submodule sync --recursive
          git -C .openxechain-src submodule update --init --recursive
          # Mesma correção validada pelo OpenXeChain-X360-Builder run #21:
          # clang-cpp nao le clang.cfg; clang -E preserva alvo Xbox/sysroot.
          cp .openxechain-src/build-toolchain.sh .openxechain-src/build-toolchain.sh.upstream
          sed -i 's#CPP="${PREFIX}/bin/clang-cpp"#CPP="${PREFIX}/bin/clang -E -nostdlib -I${PWD}/xecorelibtmp/include"#' .openxechain-src/build-toolchain.sh
          grep -F 'CPP="${PREFIX}/bin/clang -E -nostdlib -I${PWD}/xecorelibtmp/include"' .openxechain-src/build-toolchain.sh
          mkdir -p "$OPENXECHAIN_PREFIX"
          (cd .openxechain-src && PREFIX="$OPENXECHAIN_PREFIX" PARALLEL=2 ./build-toolchain.sh)

      - name: Validar toolchain
        run: |
          test -x "$OPENXECHAIN_PREFIX/bin/clang"
          test -x "$OPENXECHAIN_PREFIX/bin/synthxex"
          "$OPENXECHAIN_PREFIX/bin/clang" --version
          "$OPENXECHAIN_PREFIX/bin/synthxex" --help >/dev/null 2>&1 || true

      - name: Compile Xbox 360 PPC entry without C runtime
        run: bash scripts/build-crtless-xex.sh

      - name: Independently verify exact imports, PE/XEX entry and SHA-256
        run: |
          set -euo pipefail
          test -s "$SMB360_CRTLESS_WORK/default.xex"
          test -s "$SMB360_CRTLESS_WORK/crtless.exe"
          python3 tools/verify_crtless_xex.py --pe "$SMB360_CRTLESS_WORK/crtless.exe" --xex "$SMB360_CRTLESS_WORK/default.xex"
          grep -Fqx 'kind=S017_NATIVE_CRTLESS_XBOX_OS_BOOT_DIAGNOSTIC' "$SMB360_CRTLESS_WORK/BUILD_MANIFEST.txt"
          grep -Fqx 'runtime_test=NOT_TESTED_ON_XBOX_HARDWARE' "$SMB360_CRTLESS_WORK/BUILD_MANIFEST.txt"
          (cd "$SMB360_CRTLESS_WORK" && sha256sum -c SHA256SUMS.txt)
          test -s "$SMB360_CRTLESS_WORK/02_CANONICAL_CRTLESS/default.xex"
          test -s "$SMB360_CRTLESS_WORK/02_CANONICAL_CRTLESS/canonical.exe"
          python3 tools/verify_crtless_xex.py --pe "$SMB360_CRTLESS_WORK/02_CANONICAL_CRTLESS/canonical.exe" --xex "$SMB360_CRTLESS_WORK/02_CANONICAL_CRTLESS/default.xex" --embedded-rom assets/canonical/SMB_v026.nes
          grep -Fqx 'kind=S017_CRTLESS_CANONICAL_ROM_DIAGNOSTIC_NOT_PLAYABLE' "$SMB360_CRTLESS_WORK/02_CANONICAL_CRTLESS/BUILD_MANIFEST.txt"
          (cd "$SMB360_CRTLESS_WORK/02_CANONICAL_CRTLESS" && sha256sum -c SHA256SUMS.txt)

      - name: Publish isolated S017 native title - not Mario
        uses: actions/upload-artifact@v4
        with:
          name: smb360-S017-NATIVE-CRTLESS-DIAGNOSTIC
          path: |
            build-crtless-xex/default.xex
            build-crtless-xex/crtless.exe
            build-crtless-xex/SHA256SUMS.txt
            build-crtless-xex/BUILD_MANIFEST.txt
            build-crtless-xex/README_S017.txt
            build-crtless-xex/02_CANONICAL_CRTLESS/default.xex
            build-crtless-xex/02_CANONICAL_CRTLESS/canonical.exe
            build-crtless-xex/02_CANONICAL_CRTLESS/SHA256SUMS.txt
            build-crtless-xex/02_CANONICAL_CRTLESS/BUILD_MANIFEST.txt
          if-no-files-found: error
          retention-days: 30

      - name: Save build failure metadata only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smb360-S017-NOT-FOR-XBOX-FAILED-CI
          path: |
            build-crtless-xex/
            .openxechain-src/build.log
          if-no-files-found: ignore
          retention-days: 7
