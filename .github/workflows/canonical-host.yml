name: Canonical NES host tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/canonical/**'
      - 'src/host/**'
      - 'tools/build_host.py'
      - 'tools/frame_to_png.py'
      - 'tests/test_host_frontend.py'
      - 'tests/test_host_audio.py'
      - 'tests/test_apu*'
      - 'tests/test_cpu6502*'
      - 'tests/test_canonical_nrom.c'
      - 'tests/test_ppu*'
      - 'tests/run_canonical_rom.c'
      - 'tests/run_host_tests.sh'
      - 'tools/run_canonical.py'
      - 'tools/compare_reference.py'
      - 'tests/reference/**'
      - 'tools/verify_repository.py'
      - 'assets/canonical/**'
      - 'artifacts/**'
      - '.github/workflows/canonical-host.yml'
  pull_request:
    paths:
      - 'src/canonical/**'
      - 'src/host/**'
      - 'tools/build_host.py'
      - 'tools/frame_to_png.py'
      - 'tests/test_host_frontend.py'
      - 'tests/test_host_audio.py'
      - 'tests/**'
      - 'tools/run_canonical.py'
      - 'tools/compare_reference.py'
      - 'tests/reference/**'
      - 'tools/verify_repository.py'
      - 'assets/canonical/**'
      - 'artifacts/**'
      - '.github/workflows/canonical-host.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitize: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - name: Compile runner and run synthetic tests (no ROM)
        env:
          SANITIZE: ${{ matrix.sanitize }}
        run: sh tests/run_host_tests.sh
      - name: Verify repository inputs and reproduce canonical ROM baseline
        run: |
          python3 tools/verify_repository.py
          python3 tools/run_canonical.py --instructions 5000000 --input tests/canonical_start_right.input --frame build/ci.bin > build/ci.txt
          diff -u docs/evidence/S006/start-right.txt build/ci.txt
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pixels and CPU RAM with pinned reference
        run: python3 tools/compare_reference.py --idle-frames 600 --input-frames 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-reference-report
          path: |
            build/reference/report.json
            build/reference/compile.log
            build/reference/*.csv
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development files
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build embedded-ROM host and test SDL keyboard/rendering
        run: |
          python3 tools/build_host.py
          python3 tests/test_host_frontend.py
