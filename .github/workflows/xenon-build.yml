name: Xenon Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'include/**'
      - 'src/**'
      - 'scripts/**'
      - 'patches/**'
      - 'platform-xenon.mk'
      - '.github/workflows/xenon-build.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'scripts/**'
      - 'patches/**'
      - 'platform-xenon.mk'
      - '.github/workflows/xenon-build.yml'

jobs:
  xenon-diagnostics:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon@sha256:d79468abdd5bd624757dee8b34997f973962b4f7ee68b4a246c72c789ce85d37
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin"
          test -f "$DEVKITXENON/rules"
          test -f "$DEVKITXENON/app.lds"
          for tool in xenon-gcc xenon-g++ xenon-ar xenon-objcopy; do command -v "$tool" >/dev/null; done
          test -n "$(find "$DEVKITXENON" -name libxenon.a -print -quit)"
          test -n "$(find "$DEVKITXENON" -name libfat.a -print -quit)"
          echo "Xenon toolchain preflight: PASS"
      - name: Build and verify diagnostic Xenon ELF
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin"
          make -f platform-xenon.mk clean
          make -f platform-xenon.mk
          test -s smb360.elf32
          ident="$(od -An -tx1 -N6 smb360.elf32 | tr -d ' \n')"
          test "$ident" = "7f454c460102"
          type_machine="$(dd if=smb360.elf32 bs=1 skip=16 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')"
          case "$type_machine" in 00020014|00030014) ;; *) echo "Unexpected ELF e_type/e_machine: $type_machine" >&2; exit 1 ;; esac
          file smb360.elf32
          echo "Xenon ELF32 verification: PASS (PowerPC big-endian)"
      - name: Stage XeLL USB payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xenon-usb && mkdir xenon-usb
          cp smb360.elf32 xenon-usb/xenon.elf
          (cd xenon-usb && sha256sum xenon.elf > SHA256SUMS.txt)
          printf '%s\n' 'SMB360 XeLL diagnostic package' 'Copy xenon.elf to the root of a FAT32 USB device for XeLL Reloaded.' 'The ROM is intentionally not included in this package.' > xenon-usb/README.txt
      - name: Upload Xenon artifact
        uses: actions/upload-artifact@v4
        with:
          name: smb360-xenon-diagnostics
          path: xenon-usb/
          if-no-files-found: error
          retention-days: 14

  nathsou-real-core-compile:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon@sha256:d79468abdd5bd624757dee8b34997f973962b4f7ee68b4a246c72c789ce85d37
    env:
      NATHSOU_PIN: 2143a91e84a7aa888a31f0def9ed5f747fc3da26
      LIBXENON_IMAGE: free60/libxenon@sha256:d79468abdd5bd624757dee8b34997f973962b4f7ee68b4a246c72c789ce85d37
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact audited nathsou upstream
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/nathsou
          mkdir -p .ci/nathsou
          git -C .ci/nathsou init
          git -C .ci/nathsou remote add origin https://github.com/nathsou/smb.git
          git -C .ci/nathsou fetch --depth=1 origin "$NATHSOU_PIN"
          git -C .ci/nathsou checkout --detach FETCH_HEAD
          test "$(git -C .ci/nathsou rev-parse HEAD)" = "$NATHSOU_PIN"
          grep -q 'Apache License' .ci/nathsou/LICENSE
          grep -q 'Version 2.0' .ci/nathsou/LICENSE
      - name: Verify 19 pinned Git blobs
        shell: bash
        run: |
          set -euo pipefail
          root=.ci/nathsou
          while read -r expected path; do
            actual="$(git -C "$root" hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            fi
          done <<'EOF'
          d645695673349e3947e8e5ae42332d0ac3164cd7 LICENSE
          e94ae6adc038094ddf953727865a2d06097f142e codegen/lib/apu.c
          fe70e037f595b7dec54fd0846e6c54620698ab50 codegen/lib/apu.h
          779a38e8cd8171a1dff1e21a835a5609f08eea07 codegen/lib/code.c
          91820dccd716db733f0842b04234d62adaac1d66 codegen/lib/code.h
          6f605b4dede3b331f345a8a3b67d8085a53e5534 codegen/lib/common.c
          aabda92251d703985080473e7c12a7444c6befa2 codegen/lib/common.h
          e51099f2f27702dc62885eb88048c192330ea072 codegen/lib/constants.h
          4b42270f5f71ff2284982fb5e509c4bdab22c72c codegen/lib/cpu.c
          88407acdfe7181a47d221253f97bbd16f562de72 codegen/lib/cpu.h
          1b49716336b4a99cdb74302da0a05803873c2371 codegen/lib/data.c
          fbfe4fbe89f3f44fccd4970e670927432face5a6 codegen/lib/data.h
          548846911c8e0610eb611b529559a3172fac6d13 codegen/lib/external.h
          ff02623fcabc97891ee76168c82a9f6c79bbda04 codegen/lib/instructions.c
          347ede3443c327ca280015c24f30cd29c7b8b208 codegen/lib/instructions.h
          0bdffc4d193af2be68cc7004dfd2d3f64dd73f4d codegen/lib/ppu.c
          dc35769d582b685d7fc541b0ef4672fc67837b45 codegen/lib/ppu.h
          4482b42e5abc750304f8a5bdeedef831b9a9c378 codegen/lib/state.c
          3839132c6f37808ed588962222a69630c51cbf59 codegen/lib/state.h
          EOF
          echo "nathsou pin verification: PASS ($NATHSOU_PIN; 19 blobs)"
      - name: Package verified upstream source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf nathsou-pinned-source.tar.gz -C .ci/nathsou .
          sha256sum nathsou-pinned-source.tar.gz > nathsou-pinned-source.tar.gz.sha256
      - name: Upload verified upstream source
        uses: actions/upload-artifact@v4
        with:
          name: nathsou-pinned-source
          path: |
            nathsou-pinned-source.tar.gz
            nathsou-pinned-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Apply audited big-endian PPU patch
        shell: bash
        run: |
          set -euo pipefail
          command -v patch >/dev/null
          patch -d .ci/nathsou -p0 --batch < patches/nathsou-ppu-endian.patch
          grep -q 'smb360_palette_key' .ci/nathsou/codegen/lib/ppu.c
          echo 'nathsou endian patch: APPLIED'
      - name: Compile SMB360 with real nathsou core
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin"
          make -f platform-xenon.mk clean
          make -f platform-xenon.mk NATHSOU_ROOT="$PWD/.ci/nathsou"
          test -s smb360.elf32
          ident="$(od -An -tx1 -N6 smb360.elf32 | tr -d ' \n')"
          test "$ident" = "7f454c460102"
          type_machine="$(dd if=smb360.elf32 bs=1 skip=16 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')"
          case "$type_machine" in 00020014|00030014) ;; *) echo "Unexpected ELF e_type/e_machine: $type_machine" >&2; exit 1 ;; esac
          file smb360.elf32
          echo "real nathsou core cross-compile: PASS"
      - name: Prove real-core ELF reproducibility
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITXENON=/usr/local/xenon
          export PATH="$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin"
          cp smb360.elf32 /tmp/smb360-first.elf32
          first="$(sha256sum /tmp/smb360-first.elf32 | awk '{print $1}')"
          make -f platform-xenon.mk clean
          make -f platform-xenon.mk NATHSOU_ROOT="$PWD/.ci/nathsou"
          second="$(sha256sum smb360.elf32 | awk '{print $1}')"
          cmp -s /tmp/smb360-first.elf32 smb360.elf32
          test "$first" = "$second"
          printf 'ELF reproducibility: PASS\nsha256=%s\n' "$second" > reproducibility.txt
          echo "real-core ELF reproducibility: PASS sha256=$second"
      - name: Build and prove reproducible release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-root release-a.tar release-b.tar smb360-release.tar.gz
          mkdir release-root
          cp smb360.elf32 release-root/xenon.elf
          (cd release-root && sha256sum xenon.elf > SHA256SUMS.txt)
          printf '%s\n' \
            'SMB360 real-core XeLL release candidate' \
            'Copy xenon.elf to the root of a FAT32 USB device for XeLL Reloaded.' \
            'Place an accepted owner-supplied ROM beside it as smb.nes.' \
            'No ROM or Nintendo asset is included.' \
            'If smb.nes is missing or rejected, SMB360 enters hardware diagnostics.' \
            > release-root/README.txt
          printf 'project_commit=%s\nnathsou_commit=%s\nlibxenon_image=%s\n' "$GITHUB_SHA" "$NATHSOU_PIN" "$LIBXENON_IMAGE" > release-root/BUILD_MANIFEST.txt
          if find release-root -type f \( -iname '*.nes' -o -iname '*.fds' -o -iname '*.rom' \) | grep -q .; then
            echo 'ROM-like payload detected in release root' >&2
            exit 1
          fi
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -cf release-a.tar -C release-root .
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -cf release-b.tar -C release-root .
          cmp -s release-a.tar release-b.tar
          gzip -n -9 -c release-a.tar > smb360-release.tar.gz
          gzip -n -9 -c release-b.tar > /tmp/smb360-release-second.tar.gz
          cmp -s smb360-release.tar.gz /tmp/smb360-release-second.tar.gz
          sha256sum smb360-release.tar.gz > smb360-release.tar.gz.sha256
          cat reproducibility.txt
          echo 'release package reproducibility: PASS'
      - name: Stage real-core XeLL package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xenon-real-core && mkdir xenon-real-core
          cp release-root/xenon.elf xenon-real-core/xenon.elf
          cp release-root/SHA256SUMS.txt release-root/README.txt release-root/BUILD_MANIFEST.txt xenon-real-core/
          cp reproducibility.txt xenon-real-core/REPRODUCIBILITY.txt
      - name: Upload real-core Xenon artifact
        uses: actions/upload-artifact@v4
        with:
          name: smb360-xenon-real-core
          path: xenon-real-core/
          if-no-files-found: error
          retention-days: 14
      - name: Upload reproducible release candidate
        uses: actions/upload-artifact@v4
        with:
          name: smb360-reproducible-release
          path: |
            smb360-release.tar.gz
            smb360-release.tar.gz.sha256
            reproducibility.txt
          if-no-files-found: error
          retention-days: 14
