name: S016 Xbox boot isolation (NOT S015)
# User-tested S015 default.xex caused immediate Fatal Crash (issue #12).
# Separate XEXs for kernel-only and canonical core without XAM.
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/platform/canonical_xex/boot_*.c'
      - 'src/platform/canonical_xex/embedded_rom.S'
      - 'src/canonical/**'
      - 'scripts/build-xex-boot-isolation.sh'
      - 'tools/verify_canonical_xex.py'
      - 'tools/verify_repository.py'
      - 'docs/TESTE_FISICO_S016.md'
      - 'assets/canonical/**'
      - '.github/workflows/xex-boot-isolation.yml'
  pull_request:
    paths:
      - 'src/platform/canonical_xex/boot_*.c'
      - 'src/platform/canonical_xex/embedded_rom.S'
      - 'src/canonical/**'
      - 'scripts/build-xex-boot-isolation.sh'
      - 'tools/verify_canonical_xex.py'
      - 'tools/verify_repository.py'
      - 'docs/TESTE_FISICO_S016.md'
      - 'assets/canonical/**'
      - '.github/workflows/xex-boot-isolation.yml'
permissions:
  contents: read
  actions: read

env:
  OPENXECHAIN_COMMIT: eed1fa65bf9577fd31625764b320a90182ea9ade
  OPENXECHAIN_PREFIX: ${{ github.workspace }}/.openxechain/sysroot
  SMB360_BOOT_ISOLATION_WORK: ${{ github.workspace }}/build-boot-isolation

jobs:
  build-boot-isolation:
    name: OpenXeChain + isolated kernel/ROM boot probes
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Baixar SMBtoX360
        uses: actions/checkout@v4

      - name: Instalar dependências do OpenXeChain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld binutils git cmake make ninja-build python3 python3-yaml \
            bzip2 gzip grep findutils sed tar unzip zip gawk zlib1g-dev

      - name: Restaurar cache OpenXeChain
        id: openxechain-cache
        uses: actions/cache@v4
        with:
          path: .openxechain/sysroot
          key: openxechain-${{ runner.os }}-${{ env.OPENXECHAIN_COMMIT }}-clang-e-v1

      - name: Baixar toolchain OpenXeChain validada (run #21)
        env:
          GH_TOKEN: ${{ secrets.OPENXECHAIN_ARTIFACT_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "OPENXECHAIN_ARTIFACT_TOKEN ausente; usando fallback de compilacao local." >&2
            exit 78
          fi
          mkdir -p .openxechain-download "$OPENXECHAIN_PREFIX"
          curl -L --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o .openxechain-download/toolchain.zip \
            "https://api.github.com/repos/PedroMarioaBros/OpenXeChain-X360-Builder/actions/artifacts/10894786560/zip"
          unzip -q .openxechain-download/toolchain.zip -d .openxechain-download/artifact
          mkdir -p .openxechain
          tar -xJf .openxechain-download/artifact/openxechain-x360-toolchain.tar.xz -C .openxechain
          test -x "$OPENXECHAIN_PREFIX/bin/clang"
          test -x "$OPENXECHAIN_PREFIX/bin/synthxex"
        continue-on-error: true

      - name: Fallback - compilar OpenXeChain se artefato nao estiver acessivel
        run: |
          if [ -x "$OPENXECHAIN_PREFIX/bin/clang" ] && [ -x "$OPENXECHAIN_PREFIX/bin/synthxex" ]; then
            echo "Toolchain importada do run #21; fallback dispensado."
            exit 0
          fi
          rm -rf .openxechain-src
          git clone https://github.com/OpenXeChain/buildscript.git .openxechain-src
          git -C .openxechain-src checkout --detach "$OPENXECHAIN_COMMIT"
          sed -i 's#git@github.com:#https://github.com/#g; s#ssh://git@github.com/#https://github.com/#g' .openxechain-src/.gitmodules
          echo "Gitmodules apos conversao para HTTPS:"
          cat .openxechain-src/.gitmodules
          git -C .openxechain-src submodule sync --recursive
          git -C .openxechain-src submodule update --init --recursive
          # Mesma correção validada pelo OpenXeChain-X360-Builder run #21:
          # clang-cpp nao le clang.cfg; clang -E preserva alvo Xbox/sysroot.
          cp .openxechain-src/build-toolchain.sh .openxechain-src/build-toolchain.sh.upstream
          sed -i 's#CPP="${PREFIX}/bin/clang-cpp"#CPP="${PREFIX}/bin/clang -E -nostdlib -I${PWD}/xecorelibtmp/include"#' .openxechain-src/build-toolchain.sh
          grep -F 'CPP="${PREFIX}/bin/clang -E -nostdlib -I${PWD}/xecorelibtmp/include"' .openxechain-src/build-toolchain.sh
          mkdir -p "$OPENXECHAIN_PREFIX"
          (cd .openxechain-src && PREFIX="$OPENXECHAIN_PREFIX" PARALLEL=2 ./build-toolchain.sh)

      - name: Validar toolchain
        run: |
          test -x "$OPENXECHAIN_PREFIX/bin/clang"
          test -x "$OPENXECHAIN_PREFIX/bin/synthxex"
          "$OPENXECHAIN_PREFIX/bin/clang" --version
          "$OPENXECHAIN_PREFIX/bin/synthxex" --help >/dev/null 2>&1 || true

      - name: Build both bounded boot-isolation XEX2 files
        run: bash scripts/build-xex-boot-isolation.sh

      - name: Verify stages, checksums and safety manifest
        run: |
          set -euo pipefail
          for stage in 01_KERNEL_ONLY 02_CANONICAL_NO_XAM; do
            test -s "$SMB360_BOOT_ISOLATION_WORK/$stage/default.xex"
            test "$(dd if="$SMB360_BOOT_ISOLATION_WORK/$stage/default.xex" bs=1 count=4 2>/dev/null)" = "XEX2"
            grep -q '^direct_xam_input_notifications=NONE$SMB360_BOOT_ISOLATION_WORK/$stage/BUILD_MANIFEST.txt"
            grep -q '^xbox_boot_status=UNTESTED_NEW_IMAGE_AFTER_S015_FATAL_CRASH$' "$SMB360_BOOT_ISOLATION_WORK/$stage/BUILD_MANIFEST.txt"
            (cd "$SMB360_BOOT_ISOLATION_WORK/$stage" && sha256sum -c SHA256SUMS.txt)
          done
          echo "S016 isolation: XEX2/PowerPC/ROM layout/manifest PASS; hardware boot UNTESTED"

      - name: Publish diagnostic ZIP containing two distinct stages
        uses: actions/upload-artifact@v4
        with:
          name: smb360-S016-BOOT-ISOLATION-NOT-PLAYABLE
          path: |
            build-boot-isolation/01_KERNEL_ONLY/
            build-boot-isolation/02_CANONICAL_NO_XAM/
            build-boot-isolation/README_TESTE_S016.md
          if-no-files-found: error
          retention-days: 30

      - name: Save artifacts on CI failure for investigation only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smb360-S016-build-failure-NOT-FOR-HARDWARE
          path: |
            build-boot-isolation/
            .openxechain-src/build.log
          if-no-files-found: ignore
          retention-days: 7
 "$SMB360_BOOT_ISOLATION_WORK/$stage/BUILD_MANIFEST.txt"
            grep -q '^xbox_boot_status=UNTESTED_NEW_IMAGE_AFTER_S015_FATAL_CRASH$' "$SMB360_BOOT_ISOLATION_WORK/$stage/BUILD_MANIFEST.txt"
            (cd "$SMB360_BOOT_ISOLATION_WORK/$stage" && sha256sum -c SHA256SUMS.txt)
          done
          echo "S016 isolation: XEX2/PowerPC/ROM layout/manifest PASS; hardware boot UNTESTED"

      - name: Publish diagnostic ZIP containing two distinct stages
        uses: actions/upload-artifact@v4
        with:
          name: smb360-S016-BOOT-ISOLATION-NOT-PLAYABLE
          path: |
            build-boot-isolation/01_KERNEL_ONLY/
            build-boot-isolation/02_CANONICAL_NO_XAM/
            build-boot-isolation/README_TESTE_S016.md
          if-no-files-found: error
          retention-days: 30

      - name: Save artifacts on CI failure for investigation only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smb360-S016-build-failure-NOT-FOR-HARDWARE
          path: |
            build-boot-isolation/
            .openxechain-src/build.log
          if-no-files-found: ignore
          retention-days: 7
